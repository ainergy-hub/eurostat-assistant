<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ask questions of official Eurostat data and receive a sourced answer, chart, and table."
    />
    <title>Eurostat Lens — Ask official European data</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=20260727-4" />
  </head>
  <body>
    <section class="app-lock" id="app-lock" aria-labelledby="app-lock-title">
      <div class="lock-card">
        <span class="lock-mark" aria-hidden="true"></span>
        <p class="eyebrow">Eurostat Lens</p>
        <h1 id="app-lock-title">Welcome back</h1>
        <form class="lock-form" id="app-lock-form">
          <label for="app-lock-password">App password</label>
          <input
            id="app-lock-password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="512"
            required
          />
          <button class="send-button" id="app-unlock-button" type="submit">
            <span>Unlock app</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>
        <p class="lock-error" id="app-lock-error" role="alert" hidden></p>
      </div>
    </section>

    <div class="app-layout" id="app-layout" inert hidden>
      <aside class="sidebar" id="sidebar" aria-label="Investigations">
        <div class="sidebar-header">
          <a class="brand" href="/" aria-label="Eurostat Lens home">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-copy">
              <strong>Eurostat Lens</strong>
            </span>
          </a>
          <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Close chat list">
            ×
          </button>
        </div>

        <button class="new-chat-button" id="new-chat" type="button">
          <span>New chat</span>
          <span aria-hidden="true">＋</span>
        </button>

        <button class="tool-activity" id="tool-activity" type="button" hidden>
          <span class="tool-activity-copy">
            <span class="tool-activity-label">Tool calls</span>
            <span class="tool-activity-status" id="tool-activity-status">Starting agent</span>
          </span>
          <strong class="tool-activity-count" id="tool-activity-count" aria-live="polite">0</strong>
        </button>

        <div class="chat-nav-heading">
          <span>History</span>
          <span id="chat-count">0</span>
        </div>
        <nav class="chat-list" id="chat-list" aria-label="Saved chats"></nav>

        <div class="sidebar-foot">
          <span class="local-icon" aria-hidden="true">◌</span>
          <p>
            AI can make mistakes.
          </p>
        </div>
      </aside>
      <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close chat list"></button>

      <main class="shell">
        <header class="topbar">
          <div class="thread-identity">
            <button class="menu-button" id="menu-button" type="button" aria-label="Open chat list">
              <svg class="topbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M4 12h16M4 17h16"></path>
              </svg>
            </button>
            <div>
              <strong class="thread-title" id="current-chat-title">New investigation</strong>
            </div>
          </div>
          <div class="topbar-meta">
            <button
              class="theme-toggle-button"
              id="theme-toggle"
              type="button"
              title="Use dark mode"
              aria-label="Use dark mode"
            >
              <span class="theme-toggle-label utility-label">Dark mode</span>
              <span class="theme-toggle-icon" aria-hidden="true">
                <svg class="topbar-icon icon-sun" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="3.5"></circle>
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
                </svg>
                <svg class="topbar-icon icon-moon" viewBox="0 0 24 24">
                  <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"></path>
                </svg>
              </span>
            </button>
            <button
              class="lock-app-button"
              id="lock-app"
              type="button"
              title="Lock app"
              aria-label="Lock app"
              hidden
            >
              <span class="utility-label">Lock app</span>
              <svg class="topbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="10" width="14" height="10"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"></path>
              </svg>
            </button>
            <button
              class="download-log-button"
              id="download-chat-log"
              type="button"
              title="Download the current investigation as a JSON log"
            >
              <span class="utility-label">Download log</span>
              <svg class="topbar-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v11M8 10l4 4 4-4M5 19h14"></path>
              </svg>
            </button>
            <span class="context-status" id="context-status" hidden>Older context compacted</span>
            <div class="status-wrap">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status" id="status">Checking connection</span>
            </div>
          </div>
        </header>

        <section class="hero" id="hero">
          <h1>Explore European data.</h1>
          <div class="suggestions" aria-label="Example investigations">
            <button
              class="suggestion"
              type="button"
              data-prompt="Compare the population of Germany, France, and Italy over the latest 5 years."
            >
              <span>Population trends</span>
              <span aria-hidden="true">↗</span>
            </button>
            <button
              class="suggestion"
              type="button"
              data-prompt="How has annual inflation changed in the EU since 2020?"
            >
              <span>EU inflation</span>
              <span aria-hidden="true">↗</span>
            </button>
            <button
              class="suggestion"
              type="button"
              data-prompt="Compare the unemployment rate in Spain and Portugal over the latest 8 years."
            >
              <span>Iberian unemployment</span>
              <span aria-hidden="true">↗</span>
            </button>
          </div>
        </section>

        <section class="conversation" id="chat" aria-live="polite"></section>

        <section class="ask-panel" aria-label="Ask Eurostat">
          <form class="composer" id="composer">
            <label class="sr-only" for="prompt">Investigation query</label>
            <textarea
              id="prompt"
              name="prompt"
              rows="1"
              maxlength="4000"
              placeholder="Ask about population, inflation, jobs…"
              autocomplete="off"
              required
            ></textarea>
            <button class="send-button" type="submit" id="send">
              <span>Ask</span>
              <span aria-hidden="true">↗</span>
            </button>
          </form>
        </section>

        <footer>
          <a href="https://ec.europa.eu/eurostat/" target="_blank" rel="noreferrer">
            Eurostat source ↗
          </a>
        </footer>
      </main>
    </div>

    <dialog class="tool-call-dialog" id="tool-call-dialog" aria-labelledby="tool-call-dialog-title">
      <div class="tool-call-dialog-header">
        <div>
          <span class="thread-label">Agent activity</span>
          <h2 id="tool-call-dialog-title">Tool calls</h2>
        </div>
        <button class="dialog-close" id="tool-call-dialog-close" type="button" aria-label="Close tool-call details">
          ×
        </button>
      </div>
      <div class="tool-call-dialog-summary" id="tool-call-dialog-summary">No tool calls yet.</div>
      <ol class="tool-call-details" id="tool-call-details"></ol>
    </dialog>

    <template id="pending-template">
      <article class="response pending-response">
        <div class="response-kicker">Eurostat agent</div>
        <div class="progress-row">
          <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="progress-label">Finding candidate datasets</p>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0/build/vega.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.3/build/vega-lite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0/build/vega-embed.min.js"></script>
    <script src="/static/app.js?v=20260727-3" type="module"></script>
  </body>
</html>
