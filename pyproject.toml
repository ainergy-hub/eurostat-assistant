[project]
name = "eurostat-lens"
version = "0.3.0"
description = "Reference web app for asking sourced questions of official Eurostat data."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "psycopg[binary]==3.3.4",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
]

[tool.uv]
package = false
