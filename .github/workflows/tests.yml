name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m tests.prompt_regression replay
      - run: node --check static/app.js
      - run: node --check static/chat_store.js
      - run: node --check static/chart.js
      - run: npm run test:unit
      - run: npm run test:smoke
        env:
          # Use the Chrome preinstalled on the runner; installing Playwright's
          # Chromium with --with-deps spends minutes in apt.
          PLAYWRIGHT_CHANNEL: chrome
