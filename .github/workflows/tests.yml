name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run python -m tests.prompt_regression replay
      - run: node --check static/app.js
      - run: node --check static/chat_store.js
      - run: node --check static/chart.js
      - run: npm run test:unit
      - run: npm run test:smoke
